      const route = window.location.hash.slice(2);
      const canonicalUrl = `${window.location.pathname}${window.location.search}${route ? `#${route}` : ''}`;
      window.history.replaceState(window.history.state, '', canonicalUrl);
    }
  </script>

  <!-- Configure Tailwind CSS for custom colors and font -->

    tailwind.config = {

        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

  <style>
    :root { color-scheme: light; --page: #f5f6fb; --surface: #ffffff; --surface-muted: #edf0f8; --ink: #151a2d; --muted: #66708a; --line: #e1e5f0; --accent: #6558f5; --accent-soft: #eeedff; }
    [data-theme="dark"] { color-scheme: dark; --page: #0b1020; --surface: #11182b; --surface-muted: #18223a; --ink: #f4f6ff; --muted: #a5afc8; --line: #28334d; --accent: #8b82ff; --accent-soft: #242345; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--page); color: var(--ink); }
    * { box-sizing: border-box; }
    button, input, textarea, select { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent); outline-offset: 3px; }
    #root > div { background: var(--page) !important; color: var(--ink) !important; }
    header { background: color-mix(in srgb, var(--page) 88%, transparent) !important; border-color: var(--line) !important; }
    .tool-card { min-height: 154px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 8px 24px rgba(21, 26, 45, .035); }
    .tool-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 18px 40px rgba(50, 46, 125, .12); }
    .tool-icon { background: var(--accent-soft); color: var(--accent); }
    .tool-card:hover .tool-icon { background: var(--accent); color: #fff; }
    .category-chip { transition: background .18s ease, color .18s ease, border-color .18s ease; }
    [data-theme="dark"] .bg-white, [data-theme="dark"] .bg-gray-50 { background: var(--surface) !important; }
    [data-theme="dark"] .bg-gray-100, [data-theme="dark"] .bg-gray-200 { background: var(--surface-muted) !important; }
    [data-theme="dark"] .text-gray-900, [data-theme="dark"] .text-gray-800, [data-theme="dark"] .text-gray-700, [data-theme="dark"] .text-gray-600, [data-theme="dark"] .text-gray-500 { color: var(--muted) !important; }
    [data-theme="dark"] .border-gray-300, [data-theme="dark"] .border-gray-200 { border-color: var(--line) !important; }
    [data-theme="dark"] [class~="bg-white/80"] { background: var(--surface) !important; }
    [data-theme="dark"] [class~="bg-violet-50/70"] { background: var(--accent-soft) !important; }
    [data-theme="dark"] .bg-blue-50 { background: #14213a !important; }
    [data-theme="dark"] .text-blue-900 { color: #bfdbfe !important; }
    [data-theme="dark"] .border-blue-200 { border-color: #324b76 !important; }
    [data-theme="dark"] .bg-emerald-50 { background: #12372e !important; }
    [data-theme="dark"] .text-emerald-700 { color: #86efac !important; }
    [data-theme="dark"] .bg-amber-50 { background: #3a2f16 !important; }
    [data-theme="dark"] .text-amber-800 { color: #fcd34d !important; }
    [data-theme="dark"] .text-red-700 { color: #fca5a5 !important; }
    [data-theme="dark"] footer { border-color: var(--line) !important; color: var(--muted) !important; }
    .snake-board { width: min(100%, 400px); aspect-ratio: 1; touch-action: none; }
    .safe-wrap { overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }

      { id: 'dummy-text-generator', name: 'Dummy Text Generator', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 4h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 4h10a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z"/></svg>` },
      { id: 'password-generator', name: 'Password Generator', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4zm-2 6V6a2 2 0 0 1 4 0v2H10zm10 2v10H6V10h12zM12 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>` },
      { id: 'url-encoder-decoder', name: 'URL Encoder/Decoder', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8-8-3.58-8-8zm5-1.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H8a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H10a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H12a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2zM9 14.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H8a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H10a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H12a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2zm2 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h2z"/></svg>` },
      { id: 'temperature-converter', name: 'Temperature Converter', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9.79 2 8 3.79 8 6a4 4 0 0 0 4 4c2.21 0 4-1.79 4-4a4 4 0 0 0-4-4zm0 2a2 2 0 0 1 2 2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1 2-2zm0 6a2 2 0 0 0-2 2v8a2 2 0 0 0 4 0v-8a2 2 0 0 0-2-2z"/></svg>` },

      { id: 'image-resizer', name: 'Image Resizer', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14h2v2h-2v-2zm-2-2h-2v2h2v-2zm-2 2h2v2h-2v-2zm-2-2h-2v2h2v-2zm-2 2h2v2h-2v-2zm-2-2h-2v2h2v-2zM9 16h2v2H9v-2zm2-2h2v2h-2v-2zm-2 2h2v2H9v-2zm-2-2h-2v2h2v-2zm2 2h2v2H9v-2zM5 18h2v2H5v-2zm2-2h2v2H7v-2zm2 2h2v2H9v-2zM4 4h16v16H4V4zm-2 0a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4z"/></svg>` },
      { id: 'image-compressor', name: 'Image Compressor', svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm-4 4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6zm4 2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 1 .5-.5h2z"/></svg>` },

    const categories = ['All Tools', 'AI Tools', 'Text & Writing', 'PDF & Documents', 'Images & Design', 'Audio & Voice', 'Video', 'QR Codes & Links', 'Developer Tools', 'Calculators & Converters', 'Productivity & Text', 'SEO & Marketing', 'Business & Careers', 'Education', 'Security & Privacy', 'Games & Entertainment'];
    const categoryById = {

    };
    const existingToolNames = new Set(tools.map((tool) => tool.name.toLowerCase()));
    const implementedCatalogNames = new Set(['AI Voice Artist', 'Classic Snake Game', 'Image to PDF', 'JSON Formatter', 'JSON Validator'].map((name) => name.toLowerCase()));
    const catalogTools = [
      ...tools.map((tool) => ({
        ...tool,
        category: categoryById[tool.id] || 'Productivity & Text',
        description: toolDescriptions[tool.id] || 'A practical browser-based utility.',
        keywords: tool.id === 'text-to-speech' ? 'ai voice artist downloadable text to speech mp3 voiceover narration convert audio speak' : tool.id === 'url-encoder-decoder' ? 'url encode decode developer links' : tool.id,

      })),
      ...plannedToolCatalog.filter((tool) => !existingToolNames.has(tool.name.toLowerCase()) && !implementedCatalogNames.has(tool.name.toLowerCase())),
      { id: 'ai-voice-artist', name: 'AI Voice Artist', category: 'Audio & Voice', description: 'Preview speech in your browser. Paid AI voice generation and MP3 downloads are disabled under the $0 spending cap.', keywords: 'text speech downloadable mp3 voice narration convert', available: true, svg: tools.find((tool) => tool.id === 'text-to-speech').svg },

      { id: 'json-validator', name: 'JSON Validator', category: 'Developer Tools', description: 'Validate JSON syntax locally and see clear error feedback.', keywords: 'json validate syntax developer', available: true, svg: tools.find((tool) => tool.id === 'url-encoder-decoder').svg }
    ];

    const copyTextToClipboard = async (value) => {
      if (!value) return false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch (error) {}
      }
      let field;
      try {
        field = document.createElement('textarea');
        field.value = value;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        return document.execCommand('copy');
      } catch (error) {
        return false;
      } finally {
        field?.remove();
      }
    };

    const downloadCanvas = (canvas, filename, format = 'image/png', quality) => {
      if (!canvas || !canvas.width || !canvas.height) return Promise.resolve(false);
      return new Promise(resolve => {
        try {
          canvas.toBlob(blob => {
            if (!blob) { resolve(false); return; }
            const extension = blob.type === 'image/jpeg' ? 'jpg' : (blob.type.split('/')[1] || 'png');
            const link = document.createElement('a');
            const objectUrl = URL.createObjectURL(blob);
            link.download = `${filename.replace(/\.[^.]+$/, '')}.${extension}`;
            link.href = objectUrl;
            link.click();
            window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            resolve(true);
          }, format, quality);
        } catch (error) {
          resolve(false);
        }
      });
    };

    const ADSENSE_CLIENT_ID = 'ca-pub-5058994010586674';
    const ADSENSE_AD_SLOT_ID = '';
    const PAID_VOICE_GENERATION_ENABLED = false;

    // Reusable AdSenseAd component
    const AdSenseAd = ({ slot, client = ADSENSE_CLIENT_ID }) => {
      const hasValidSlot = /^\d{5,}$/.test(String(slot || ''));
      React.useEffect(() => {
        if (!hasValidSlot) return undefined;
        let script = document.querySelector('script[data-adsense-loader]');
        const pushAd = () => {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch {}
        };
        if (script?.dataset.loaded === 'true') {
          pushAd();
          return undefined;
        }
        if (!script) {
          script = document.createElement('script');
          script.async = true;
          script.dataset.adsenseLoader = 'true';
          script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(client)}`;
          script.crossOrigin = 'anonymous';
          script.addEventListener('load', () => { script.dataset.loaded = 'true'; pushAd(); }, { once: true });
          document.head.appendChild(script);
        } else {
          script.addEventListener('load', pushAd, { once: true });
        }
        return undefined;
      }, [client, hasValidSlot]);

      if (!hasValidSlot) return null;
      return React.createElement('div', { className: "flex justify-center p-2 my-4" },
        React.createElement('ins', {
          className: "adsbygoogle",
          style: { display: 'block', textAlign: 'center' },
          'data-ad-client': client,
          'data-ad-slot': slot,
          'data-ad-format': "auto",
          'data-full-width-responsive': "true"
        })
      );
    };

    const AdvertisementSection = () => React.createElement(
      'aside',
      { 'aria-labelledby': 'advertisement-heading', className: 'mx-auto max-w-7xl px-5 pb-7 sm:px-8' },

        ADSENSE_AD_SLOT_ID
          ? React.createElement(AdSenseAd, { client: ADSENSE_CLIENT_ID, slot: ADSENSE_AD_SLOT_ID })
          : React.createElement('p', { className: 'mt-2 text-sm text-gray-500' }, 'Ad space reserved. Ads stay disabled until a numeric AdSense ad-unit slot ID is configured.')
      )
    );

    // Main App component that manages navigation and workspace preferences
    function App() {
      const initialPage = window.location.hash.replace(/^#\/?/, '') || 'home';
      const [currentPage, setCurrentPageState] = React.useState(initialPage);
      const [theme, setTheme] = React.useState(() => {
        try { return window.localStorage.getItem('devtools-hub-theme') || 'dark'; } catch { return 'dark'; }
      });
      const [favorites, setFavorites] = React.useState(() => {
        try { return JSON.parse(window.localStorage.getItem('devtools-hub-favorites') || '[]'); } catch { return []; }
      });
      const [favoritesOnly, setFavoritesOnly] = React.useState(false);

      const setCurrentPage = (page) => {
        setCurrentPageState(page);
        const nextUrl = page === 'home' ? `${window.location.pathname}${window.location.search}` : `#${page}`;
        window.history.pushState(null, '', nextUrl);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      React.useEffect(() => {
        const syncPage = () => setCurrentPageState(window.location.hash.replace(/^#\/?/, '') || 'home');
        window.addEventListener('popstate', syncPage);
        return () => window.removeEventListener('popstate', syncPage);
      }, []);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
